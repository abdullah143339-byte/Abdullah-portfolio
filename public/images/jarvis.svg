<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="45%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="25%"  stop-color="#ffe08a"/>
      <stop offset="60%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- outer dark disc -->
  <circle cx="256" cy="256" r="240" fill="#0d0d0d"/>
  <!-- outer ring segments -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#292524" stroke-width="6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="4"
    stroke-dasharray="33 27" stroke-linecap="round"/>
  <!-- mid ring segments -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#292524" stroke-width="5"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fbbf24" stroke-width="3"
    stroke-dasharray="23 20" stroke-linecap="round"/>
  <!-- inner ring -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="#44403c" stroke-width="4"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#fcd34d" stroke-width="2.5"
    stroke-dasharray="14 13" stroke-linecap="round"/>
  <!-- glow base -->
  <circle cx="256" cy="248" r="60" fill="url(#glow)" filter="url(#blur)"/>
  <!-- triangle core -->
  <polygon points="256,200 298,268 214,268" fill="none" stroke="#fcd34d" stroke-width="3.5"
    stroke-linejoin="round"/>
  <!-- center core -->
  <circle cx="256" cy="248" r="30" fill="url(#core)"/>
  <!-- tiny center dot -->
  <circle cx="256" cy="248" r="5" fill="#ffffff"/>
</svg>
